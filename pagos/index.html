<html lang="es">

<title>Pagos · Clowder</title>
<meta name="description" content="Consulta las cuentas bancarias de Clowder Coffee House para pagar tu pedido.">
<link rel="canonical" href="https://clowder.cafe/pagos/">
<meta property="og:type" content="website">
<meta property="og:title" content="Pagos · Clowder">
<meta property="og:description" content="Consulta las cuentas bancarias de Clowder Coffee House para pagar tu pedido.">
<meta property="og:url" content="https://clowder.cafe/pagos/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* coffee house base */
    --cream:#faf3e4;
    --card:#fffdf9;
    --ink:#442c19;      /* Clowder secondary: brown */
    --ink-soft:#a4907c;

    /* Clowder secondary palette */
    --terracota:#cc835a;
    --azul:#b6daea;
    --amarillo:#faef9a;
    --lavanda:#d5c8df;
    --verde:#3f854a;

    --accent:var(--terracota);
    --accent-deep:#a85a34;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    background:var(--cream);
    font-family:'Nunito', ui-sans-serif, sans-serif;
    color:var(--ink);
    position:relative;
    overflow:hidden;
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    opacity:.5;
    z-index:0;
  }
  .blob.one{ width:260px; height:260px; background:var(--azul); top:-90px; left:-90px; }
  .blob.two{ width:220px; height:220px; background:var(--amarillo); bottom:-70px; right:-70px; }

  .card{
    position:relative;
    z-index:1;
    width:340px;
    max-width:100%;
    background:var(--card);
    padding:32px 28px 28px;
    border-radius:32px;
    box-shadow:0 20px 45px rgba(68,44,25,.14), 0 4px 10px rgba(68,44,25,.06);
  }

  .brand{ text-align:center; margin-bottom:6px; }
  .logo-badge{
    width:104px;
    height:104px;
    margin:0 auto 10px;
    border-radius:50%;
    background:#f6e3d5;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-badge img{ width:74px; height:auto; display:block; }
  .brand .tag{
    font-size:12px;
    letter-spacing:2px;
    color:var(--ink-soft);
    text-transform:uppercase;
    font-weight:700;
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-size:21px;
    font-weight:700;
    text-align:center;
    margin:16px 0 18px;
    color:var(--ink);
  }

  .banks{ display:flex; flex-direction:column; gap:10px; }

  .bank{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    border-radius:18px;
    background:#f7f0e4;
    cursor:pointer;
    font-weight:700;
    font-size:14.5px;
    user-select:none;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }

  .dot{
    width:16px;
    height:16px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);
  }

  .bank-label{ flex:1; }

  .arrow{
    opacity:0;
    transform:translateX(-4px);
    transition:opacity .15s ease, transform .15s ease;
  }

  .bank:hover,
  .bank:focus-visible{
    transform:translateY(-2px);
    background:color-mix(in srgb, var(--dot) 22%, white);
    outline:none;
    box-shadow:0 6px 14px rgba(68,44,25,.12);
  }
  .bank:hover .arrow,
  .bank:focus-visible .arrow{ opacity:1; transform:translateX(0); }

  .bank.active{
    background:color-mix(in srgb, var(--dot) 38%, white);
    box-shadow:0 8px 18px rgba(68,44,25,.16);
  }
  .bank.active .arrow{ opacity:1; transform:translateX(0); color:var(--ink); }

  .details{
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transition:grid-template-rows .35s ease, opacity .3s ease;
  }
  .details.open{ grid-template-rows:1fr; opacity:1; }
  .details-inner{ overflow:hidden; }

  .badge-row{ display:flex; align-items:center; gap:8px; margin-top:22px; }
  .bank-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 12px;
    border-radius:999px;
    background:color-mix(in srgb, var(--dot) 30%, white);
    color:var(--ink);
    font-size:11.5px;
    font-weight:800;
    letter-spacing:.4px;
    text-transform:uppercase;
  }
  .bank-pill .dot{ width:9px; height:9px; box-shadow:none; }

  .account-number{
    font-family:'Baloo 2', sans-serif;
    font-size:30px;
    font-weight:800;
    color:var(--accent-deep);
    margin:10px 0 16px;
    letter-spacing:1px;
    word-break:break-all;
  }

  .field{ font-size:13px; color:var(--ink-soft); line-height:1.7; font-weight:600; }
  .field b{ color:var(--ink); font-weight:800; }

  button.copy{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:none;
    border-radius:999px;
    background:var(--terracota);
    color:white;
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
    position:relative;
    overflow:visible;
    box-shadow:0 8px 18px rgba(204,131,90,.4);
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
  }
  button.copy:hover{ background:var(--accent-deep); }
  button.copy:active{ transform:scale(.96); }

  button.copy.copied{
    background:var(--verde);
    box-shadow:0 8px 18px rgba(63,133,74,.35);
  }

  .paw{
    position:absolute;
    top:-6px;
    font-size:18px;
    opacity:0;
    pointer-events:none;
    transform:translateY(0) rotate(0deg) scale(.6);
  }
  .paw.pop{ animation:pawpop .8s ease forwards; }
  @keyframes pawpop{
    0%{ opacity:0; transform:translateY(0) rotate(var(--rot,0deg)) scale(.5); }
    30%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-46px) rotate(var(--rot,0deg)) scale(1.1); }
  }

  .footer-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:700;
    margin-top:22px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>

    el.addEventListener('click', () => selectBank(i, el));
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectBank(i, el);
      }
    });
    banksEl.appendChild(el);
  });

  function selectBank(index, el){
    const bank = BANKS[index];
    document.querySelectorAll('.bank').forEach(b => b.classList.remove('active'));
    el.classList.add('active');

    bankNameEl.textContent = bank.name;
    pillDotEl.style.background = bank.color;
    accountNumberEl.textContent = bank.number;
    currentNumber = bank.number;

    document.getElementById('bankPill').style.setProperty('--dot', bank.color);
    document.documentElement.style.setProperty('--accent-deep', bank.deep);
    detailsEl.style.setProperty('--dot', bank.color);

    detailsEl.classList.add('open');
    copyBtn.classList.remove('copied');
    copyBtn.textContent = 'Copiar número';

    if (!prefersReducedMotion()) {
      detailsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function prefersReducedMotion(){
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function launchPaws(){
    if (prefersReducedMotion()) return;
    const positions = [20, 45, 70, 90];
    positions.forEach((left) => {
      const paw = document.createElement('span');
      paw.className = 'paw';
      paw.textContent = '🐾';
      paw.style.left = left + '%';
      paw.style.setProperty('--rot', (Math.random() * 40 - 20) + 'deg');
      copyBtn.parentElement.appendChild(paw);
      requestAnimationFrame(() => paw.classList.add('pop'));
      setTimeout(() => paw.remove(), 850);
    });
  }

  copyBtn.addEventListener('click', async () => {
    if (!currentNumber) return;
    try {
      await navigator.clipboard.writeText(currentNumber);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = currentNumber;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    copyBtn.classList.add('copied');
    copyBtn.textContent = '¡Copiado! 🐾';
    launchPaws();

    clearTimeout(copyBtn._resetTimer);
    copyBtn._resetTimer = setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyBtn.textContent = 'Copiar número';
    }, 1800);
  });
</script>
</body>
</html>
