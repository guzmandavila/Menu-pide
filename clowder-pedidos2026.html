<style>
  :root{
    --bg:#181310;
    --bg-alt:#231c17;
    --card:#211a15;
    --cream:#f8f3e7;
    --cream-dim:#a89f8f;
    --gold:#f8f3e7;
    --gold-dim:#d8d2c2;
    --sage:#f8f3e7;
    --line:rgba(248,243,231,0.22);
    --radius:14px;
    --theme-transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  body.light-theme{
    --bg:#f8f4ea;
    --bg-alt:#eee5d2;
    --card:#ffffff;
    --cream:#221a14;
    --cream-dim:#6f6555;
    --gold:#221a14;
    --gold-dim:#4a4032;
    --sage:#221a14;
    --line:rgba(34,26,20,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:100px;
    -webkit-font-smoothing:antialiased;
    transition:var(--theme-transition);
  }
  /* Header */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:20px 20px 14px;
    text-align:center;
    transition:var(--theme-transition);
  }
  header .logo{
    height:64px;
    width:auto;
    display:block;
    margin:0 auto;
    transition:filter .25s ease;
  }
  body.light-theme header .logo{
    filter:invert(1);
  }
  .theme-toggle{
    position:absolute; top:18px; right:18px;
    width:38px; height:38px; border-radius:50%;
    background:var(--bg-alt); border:1px solid var(--line);
    color:var(--cream); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
  }
  .theme-toggle svg{width:18px; height:18px;}
  .theme-toggle .icon-moon{display:none;}
  body.light-theme .theme-toggle .icon-sun{display:none;}
  body.light-theme .theme-toggle .icon-moon{display:block;}
  header .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:6px;
  }

  /* Category pills */
  .cats{
    display:flex; gap:8px; overflow-x:auto;
    padding:14px 16px; position:sticky; top:96px; z-index:19;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .cat-btn{
    flex:0 0 auto;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--cream-dim);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 18px;
    cursor:pointer;
    position:relative;
    transition:.2s;
  }
  .cat-btn.active{
    color:var(--bg);
    background:var(--gold);
    border-color:var(--gold);
  }
  .cat-dot{
    width:9px; height:9px; border-radius:50%;
    display:inline-block; margin-right:7px; vertical-align:middle;
  }
  .section-label .cat-dot{width:13px; height:13px; margin-right:9px;}

  /* Items */
  main{padding:18px 16px 10px; max-width:560px; margin:0 auto;}
  .section-label{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:21px;
    color:var(--gold);
    margin:24px 4px 12px;
    display:flex; align-items:center;
  }
  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-left-width:4px;
    border-left-style:solid;
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .item-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
  }
  .item-thumb{
    width:76px; height:76px; border-radius:12px; object-fit:cover;
    flex-shrink:0; border:1px solid var(--line);
  }
  .item-info{flex:1; min-width:0;}
  .item-name{font-family:'Inter',sans-serif; font-weight:700; font-size:17.5px; color:var(--cream); line-height:1.3;}
  .item-desc{font-size:14.5px; color:var(--cream-dim); margin-top:4px; line-height:1.5;}
  .item-price{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:17px;
    color:var(--gold); white-space:nowrap;
  }
  .item-controls{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; gap:10px;
  }
  .stepper{
    display:flex; align-items:center; gap:0;
    border:1px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .stepper button{
    width:40px; height:38px; background:var(--bg-alt); border:none; color:var(--cream);
    font-size:19px; cursor:pointer; line-height:1;
  }
  .stepper button:active{background:var(--gold); color:var(--bg);}
  .stepper .qty{
    width:34px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:15.5px;
  }
  .note-toggle{
    background:transparent; border:1px dashed var(--line); color:var(--cream-dim);
    font-size:13.5px; border-radius:8px; padding:9px 12px; cursor:pointer; font-family:'Inter',sans-serif;
    flex:1;
  }
  .note-toggle.has-note{border-color:var(--sage); color:var(--sage);}
  .note-input{
    display:none; width:100%; margin-top:10px;
    background:var(--bg-alt); border:1px solid var(--line); border-radius:8px;
    color:var(--cream); font-family:'Inter',sans-serif; font-size:14.5px;
    padding:10px 12px; resize:none;
  }
  .note-input.open{display:block;}
  .milk-select{
    width:100%; margin-top:9px; background:var(--bg-alt); border:1px solid var(--line);
    border-radius:8px; color:var(--cream); font-family:'Inter',sans-serif; font-size:13.5px;
    padding:9px 10px;
  }

  /* Floating cart bar */
  .cartbar{
    position:fixed; left:16px; right:16px; bottom:16px; z-index:30;
    background:var(--gold); color:var(--bg);
    border-radius:16px; padding:15px 18px;
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    cursor:pointer; transform:translateY(120%); transition:transform .3s ease;
    max-width:560px; margin:0 auto; right:0; left:0;
    width:calc(100% - 32px);
  }
  .cartbar.show{transform:translateY(0);}
  .cartbar .left{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16.5px;}
  .cartbar .count{
    background:var(--bg); color:var(--gold); font-family:'IBM Plex Mono',monospace;
    font-size:13px; padding:4px 9px; border-radius:999px;
  }
  .cartbar .right{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:16.5px;}

  /* Cart drawer */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{display:flex;}
  .drawer{
    background:var(--bg); width:100%; max-width:560px; max-height:88vh;
    border-radius:20px 20px 0 0; padding:20px 20px 24px; overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .drawer-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .drawer-head h2{font-family:'Fraunces',serif; font-weight:600; font-size:25px; margin:0;}
  .drawer-head button{background:none; border:none; color:var(--cream-dim); font-size:26px; cursor:pointer;}
  .cart-row{
    border-bottom:1px solid var(--line); padding:14px 0;
    display:flex; justify-content:space-between; gap:10px;
  }
  .cart-row .info{flex:1;}
  .cart-row .info .n{font-weight:600; font-size:16px;}
  .cart-row .info .note{font-size:13.5px; color:var(--sage); margin-top:3px;}
  .cart-row .price{font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--gold); white-space:nowrap;}
  .cart-row .rm{background:none;border:none;color:var(--cream-dim);font-size:13.5px;text-decoration:underline;cursor:pointer;margin-top:5px;}
  .empty-cart{text-align:center; padding:30px 10px; color:var(--cream-dim); font-size:15px;}

  .fields{margin-top:16px; display:flex; flex-direction:column; gap:10px;}
  .fields label{font-size:13px; color:var(--cream-dim); font-family:'IBM Plex Mono',monospace; letter-spacing:.5px; text-transform:uppercase;}
  .fields input, .fields textarea{
    background:var(--bg-alt); border:1px solid var(--line); border-radius:10px;
    color:var(--cream); padding:11px 13px; font-family:'Inter',sans-serif; font-size:15.5px; margin-top:4px;
  }
  .toggle-row{display:flex; gap:8px;}
  .toggle-row button{
    flex:1; background:var(--bg-alt); border:1px solid var(--line); color:var(--cream-dim);
    padding:12px; border-radius:10px; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .toggle-row button.active{background:var(--sage); color:var(--bg); border-color:var(--sage);}

  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    margin:18px 0 12px; padding-top:12px; border-top:1px solid var(--line);
  }
  .total-row .lbl{font-family:'Fraunces',serif; font-style:italic; font-size:20px; color:var(--gold);}
  .total-row .val{font-family:'IBM Plex Mono',monospace; font-size:23px; font-weight:600;}

  .send-btn{
    width:100%; background:var(--cream); color:var(--bg); border:none; border-radius:12px;
    padding:17px; font-family:'Inter',sans-serif; font-weight:700; font-size:16.5px;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }
  .send-btn:disabled{background:var(--bg-alt); color:var(--cream-dim); cursor:not-allowed;}
  .send-hint{text-align:center; font-size:12.5px; color:var(--cream-dim); margin-top:9px;}
</style>
</head>

const CATS = [...new Set(MENU.map(i=>i.cat))];

/* Colores secundarios de marca — uno por categoría de sabor */
const CAT_COLORS = {
  'Bebidas Calientes': '#442C19',
  'Bebidas Frías':     '#B6DAEA',
  'Matcha':            '#3F854A',
  'Snack Dulce':        '#CC835A',
  'Snack Sal':          '#FAEF9A',
};
function catColor(c){ return CAT_COLORS[c] || 'transparent'; }

let activeCat = CATS[0];
let cart = {}; // id -> {qty, note}
let mode = 'mesa';

function renderCats(){
  const el = document.getElementById('cats');
  el.innerHTML = CATS.map(c => `<button class="cat-btn ${c===activeCat?'active':''}" onclick="selectCat('${c}')"><span class="cat-dot" style="background:${catColor(c)}"></span>${c}</button>`).join('');
}
function selectCat(c){ activeCat = c; renderCats(); renderMenu(); }

function renderMenu(){
  const items = MENU.filter(i=>i.cat===activeCat);
  const el = document.getElementById('menu');
  el.innerHTML = `<div class="section-label"><span class="cat-dot" style="background:${catColor(activeCat)}"></span>${activeCat}</div>` + items.map(i=>{
    const inCart = cart[i.id];
    const qty = inCart ? inCart.qty : 0;
    const note = inCart ? inCart.note : '';
    const milk = inCart ? (inCart.milk || '') : '';
    const scoop = inCart ? (inCart.scoop || '') : '';
    return `
    <div class="item" style="border-left-color:${catColor(i.cat)==='transparent' ? 'var(--line)' : catColor(i.cat)};">
      <div class="item-top">
        ${i.img ? `<img class="item-thumb" src="${i.img}" alt="${i.name}">` : ''}
        <div class="item-info">
          <div class="item-name">${i.name}</div>
          <div class="item-desc">${i.desc}</div>
        </div>
        <div class="item-price">$${i.price.toFixed(2)}</div>
      </div>
      <div class="item-controls">
        <div class="stepper">
          <button onclick="changeQty('${i.id}', -1)">–</button>
          <div class="qty" id="qty-${i.id}">${qty}</div>
          <button onclick="changeQty('${i.id}', 1)">+</button>
        </div>
        <button class="note-toggle ${note?'has-note':''}" id="notebtn-${i.id}" onclick="toggleNote('${i.id}')">${note ? '✎ '+truncate(note) : '+ nota'}</button>
      </div>
      ${i.milk ? `
      <select class="milk-select" id="milk-${i.id}" onchange="setMilk('${i.id}', this.value)">
        <option value="" ${milk===''?'selected':''}>Leche deslactosada</option>
        <option value="almendra" ${milk==='almendra'?'selected':''}>+ Leche vegetal de almendras, casera (+$0.50)</option>
      </select>` : ''}
      ${i.scoop ? `
      <select class="milk-select" id="scoop-${i.id}" onchange="setScoop('${i.id}', this.value)">
        <option value="" ${scoop===''?'selected':''}>Sin bola de helado</option>
        <option value="si" ${scoop==='si'?'selected':''}>+ Bola de helado de vainilla Madagascar (+$0.75)</option>
      </select>` : ''}
      <textarea class="note-input" id="note-${i.id}" rows="2" placeholder="Ej: sin cebolla, para llevar aparte..." onblur="saveNote('${i.id}', this.value)">${note}</textarea>
    </div>`;
  }).join('');
}
function truncate(s){ return s.length>18 ? s.slice(0,18)+'…' : s; }

function unitPrice(id){
  const item = MENU.find(m=>m.id===id);
  let p = item.price;
  if(cart[id] && cart[id].milk) p += 0.5;
  if(cart[id] && cart[id].scoop) p += 0.75;
  return p;
}

function changeQty(id, delta){
  const current = cart[id]?.qty || 0;
  const next = Math.max(0, current + delta);
  if(next===0){ delete cart[id]; }
  else { cart[id] = { qty: next, note: cart[id]?.note || '', milk: cart[id]?.milk || '', scoop: cart[id]?.scoop || '' }; }
  document.getElementById('qty-'+id).textContent = next;
  updateBars();
}

function setMilk(id, value){
  if(cart[id]) cart[id].milk = value;
  else { cart[id] = { qty:1, note:'', milk: value, scoop:'' }; document.getElementById('qty-'+id).textContent = 1; }
  updateBars();
}

function setScoop(id, value){
  if(cart[id]) cart[id].scoop = value;
  else { cart[id] = { qty:1, note:'', milk:'', scoop: value }; document.getElementById('qty-'+id).textContent = 1; }
  updateBars();
}

function toggleNote(id){
  const box = document.getElementById('note-'+id);
  box.classList.toggle('open');
  if(box.classList.contains('open')) box.focus();
}
function saveNote(id, val){
  if(cart[id]) cart[id].note = val.trim();
  else if(val.trim()){ cart[id] = { qty:1, note: val.trim(), milk:'', scoop:'' }; document.getElementById('qty-'+id).textContent = 1; }
  const btn = document.getElementById('notebtn-'+id);
  if(val.trim()){ btn.textContent = '✎ '+truncate(val.trim()); btn.classList.add('has-note'); }
  else { btn.textContent = '+ nota'; btn.classList.remove('has-note'); }
  updateBars();
}

function cartCount(){ return Object.values(cart).reduce((a,c)=>a+c.qty,0); }
function cartTotal(){
  return Object.entries(cart).reduce((sum,[id,c])=>{
    return sum + (unitPrice(id) * c.qty);
  },0);
}
const DRINK_CATS = ['Bebidas Calientes','Bebidas Frías','Matcha'];
const SNACK_CATS = ['Snack Sal','Snack Dulce'];

function packagingReasons(){
  if(mode!=='llevar') return [];
  const reasons = [];
  const hasSnack = Object.keys(cart).some(id=>{
    const item = MENU.find(m=>m.id===id);
    return item && SNACK_CATS.includes(item.cat);
  });
  if(hasSnack) reasons.push({label:'empaque', fee:0.5});
  const drinkQty = Object.entries(cart).reduce((sum,[id,c])=>{
    const item = MENU.find(m=>m.id===id);
    return sum + (item && DRINK_CATS.includes(item.cat) ? c.qty : 0);
  },0);
  if(drinkQty > 1) reasons.push({label:'portavasos', fee:0.5});
  return reasons;
}
function packagingFee(){ return packagingReasons().reduce((s,r)=>s+r.fee,0); }
function grandTotal(){ return cartTotal() + packagingFee(); }

function updateBars(){
  const count = cartCount();
  const total = grandTotal();
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = '$'+total.toFixed(2);
  document.getElementById('drawerTotal').textContent = '$'+total.toFixed(2);
  document.getElementById('cartbar').classList.toggle('show', count>0);
  document.getElementById('sendBtn').disabled = count===0;

  const reasons = packagingReasons();
  const pkgLine = document.getElementById('packagingLine');
  if(reasons.length===0){
    pkgLine.style.display = 'none';
  } else {
    pkgLine.style.display = 'block';
    pkgLine.textContent = reasons.map(r => `+ $${r.fee.toFixed(2)} ${r.label}`).join(' · ');
  }

  renderCartList();
}

function renderCartList(){
  const el = document.getElementById('cartList');
  const entries = Object.entries(cart);
  if(entries.length===0){ el.innerHTML = '<div class="empty-cart">Todavía no agregas nada</div>'; return; }
  el.innerHTML = entries.map(([id,c])=>{
    const item = MENU.find(m=>m.id===id);
    const milkLabel = c.milk ? `+ leche vegetal (${c.milk === 'almendra' ? 'almendra' : 'avena'})` : '';
    const scoopLabel = c.scoop ? `+ bola de helado de vainilla Madagascar` : '';
    return `
    <div class="cart-row">
      <div class="info">
        <div class="n">${c.qty}x ${item.name}</div>
        ${milkLabel ? `<div class="note">${milkLabel}</div>` : ''}
        ${scoopLabel ? `<div class="note">${scoopLabel}</div>` : ''}
        ${c.note ? `<div class="note">nota: ${c.note}</div>` : ''}
        <button class="rm" onclick="changeQty('${id}', -${c.qty})">quitar</button>
      </div>
      <div class="price">$${(unitPrice(id)*c.qty).toFixed(2)}</div>
    </div>`;
  }).join('');
}

document.getElementById('cartbar').addEventListener('click', openCart);
function openCart(){ document.getElementById('overlay').classList.add('open'); }
function closeCart(){ document.getElementById('overlay').classList.remove('open'); }

function toggleTheme(){
  document.body.classList.toggle('light-theme');
}

function setMode(m){
  mode = m;
  document.getElementById('btnMesa').classList.toggle('active', m==='mesa');
  document.getElementById('btnLlevar').classList.toggle('active', m==='llevar');
  updateBars();
}

function sendOrder(){
  const name = document.getElementById('customerName').value.trim() || 'Sin nombre';
  const entries = Object.entries(cart);
  if(entries.length===0) return;

  let msg = `*Pedido Clowder*\n`;
  msg += `Cliente: ${name}\n`;
  msg += mode==='mesa' ? `Para servir\n` : `Para llevar\n`;
  msg += `-----------------------------\n`;
  entries.forEach(([id,c])=>{
    const item = MENU.find(m=>m.id===id);
    msg += `${c.qty}x ${item.name} — $${(unitPrice(id)*c.qty).toFixed(2)}\n`;
    if(c.milk) msg += `   + leche vegetal (${c.milk})\n`;
    if(c.scoop) msg += `   + bola de helado de vainilla Madagascar\n`;
    if(c.note) msg += `   nota: ${c.note}\n`;
  });
  msg += `-----------------------------\n`;
  packagingReasons().forEach(r => { msg += `${r.label}: $${r.fee.toFixed(2)}\n`; });
  msg += `*Total: $${grandTotal().toFixed(2)}*`;

  /* EDITA ESTE NÚMERO: código de país + número, sin + ni espacios */
  const WHATSAPP_NUMBER = '593979982241';

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

  // Algunos navegadores (Safari, webviews de Instagram/Facebook/TikTok, o con
  // bloqueador de ventanas emergentes) no dejan abrir window.open en una pestaña
  // nueva. Si eso pasa, navegamos en la misma pestaña como respaldo.
  let opened = null;
  try { opened = window.open(url, '_blank'); } catch(e) { opened = null; }
  if(!opened || opened.closed || typeof opened.closed === 'undefined'){
    window.location.href = url;
  }
}

renderCats();
renderMenu();
updateBars();
</script>
